<!--
  Illustration of magic_z3 / MagicTorsionSquare:
  M(i,j) = (i+j, j) mod 3 on (Z/3Z)^2.
  Rows, columns, and both diagonals sum to (0,0).
  Drawn by hand. Not a frame emitted by the programs.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
  <title id="title">Torsion square on (Z/3Z)^2</title>
  <desc id="desc">Nine cells (0,0) (1,1) (2,2) / (1,0) (2,1) (0,2) / (2,0) (0,1) (1,2). Every row, column, and both diagonals sum to (0,0).</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#16132c"/>
      <stop offset="55%" stop-color="#0b0a16"/>
      <stop offset="100%" stop-color="#05040c"/>
    </radialGradient>
    <radialGradient id="orbV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b388ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b388ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce1ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5ce1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7af6ff"/>
      <stop offset="38%" stop-color="#efe9ff"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2444" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0c1024" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f4fbff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="num" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7e7ff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f8f7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="plate">
      <rect x="300" y="86" width="480" height="480" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1080" height="720" fill="url(#bg)"/>
  <circle cx="168" cy="118" r="210" fill="url(#orbV)" filter="url(#soft)"/>
  <circle cx="930" cy="600" r="240" fill="url(#orbC)" filter="url(#soft)"/>
  <circle cx="820" cy="90" r="90" fill="#7c5cff" opacity="0.18" filter="url(#soft)"/>

  <g opacity="0.55" filter="url(#edge)">
    <rect x="324" y="108" width="480" height="480" rx="32" fill="none" stroke="#a78bfa" stroke-width="2" transform="rotate(-7 564 348)"/>
  </g>
  <rect x="312" y="96" width="480" height="480" rx="30" fill="none" stroke="#67e8f9" stroke-width="1.25" opacity="0.45"/>

  <rect x="300" y="86" width="480" height="480" rx="28" fill="#0a0c18" fill-opacity="0.72" stroke="url(#rim)" stroke-width="1.6"/>
  <g clip-path="url(#plate)">
    <rect x="120" y="250" width="860" height="36" fill="url(#sweep)" transform="rotate(-24 540 326)" opacity="0.55"/>
  </g>

  <g font-family="Inter, 'Noto Sans', sans-serif" text-anchor="middle">
    <g fill="url(#glass)" stroke="url(#rim)" stroke-width="1.15">
      <rect x="328" y="114" width="132" height="132" rx="18"/>
      <rect x="474" y="114" width="132" height="132" rx="18"/>
      <rect x="620" y="114" width="132" height="132" rx="18"/>
      <rect x="328" y="260" width="132" height="132" rx="18"/>
      <rect x="474" y="260" width="132" height="132" rx="18"/>
      <rect x="620" y="260" width="132" height="132" rx="18"/>
      <rect x="328" y="406" width="132" height="132" rx="18"/>
      <rect x="474" y="406" width="132" height="132" rx="18"/>
      <rect x="620" y="406" width="132" height="132" rx="18"/>
    </g>
    <g fill="url(#sheen)">
      <rect x="346" y="124" width="96" height="2" rx="1"/>
      <rect x="492" y="124" width="96" height="2" rx="1"/>
      <rect x="638" y="124" width="96" height="2" rx="1"/>
      <rect x="346" y="270" width="96" height="2" rx="1"/>
      <rect x="492" y="270" width="96" height="2" rx="1"/>
      <rect x="638" y="270" width="96" height="2" rx="1"/>
      <rect x="346" y="416" width="96" height="2" rx="1"/>
      <rect x="492" y="416" width="96" height="2" rx="1"/>
      <rect x="638" y="416" width="96" height="2" rx="1"/>
    </g>
    <g fill="url(#num)" font-size="34" font-weight="600">
      <text x="394" y="190">(0, 0)</text>
      <text x="540" y="190">(1, 1)</text>
      <text x="686" y="190">(2, 2)</text>
      <text x="394" y="336">(1, 0)</text>
      <text x="540" y="336">(2, 1)</text>
      <text x="686" y="336">(0, 2)</text>
      <text x="394" y="482">(2, 0)</text>
      <text x="540" y="482">(0, 1)</text>
      <text x="686" y="482">(1, 2)</text>
    </g>
    <g fill="#8ee9ff" font-size="15" font-weight="500" opacity="0.9">
      <text x="812" y="190">(0, 0)</text>
      <text x="812" y="336">(0, 0)</text>
      <text x="812" y="482">(0, 0)</text>
      <text x="394" y="604">(0, 0)</text>
      <text x="540" y="604">(0, 0)</text>
      <text x="686" y="604">(0, 0)</text>
    </g>
  </g>

  <text x="540" y="652" fill="#c9d4ea" font-family="Inter, 'Noto Sans', sans-serif" font-size="18" font-weight="500" text-anchor="middle">Both diagonals sum to (0, 0)</text>
  <text x="540" y="684" fill="#7f8eab" font-family="Inter, 'Noto Sans', sans-serif" font-size="14" text-anchor="middle">Hand-drawn plate of M(i, j) = (i + j, j) mod 3</text>
</svg>
